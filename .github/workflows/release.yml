name: Sync PdfCraft release

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfcraft-release
  cancel-in-progress: false

env:
  UPSTREAM: storytold/pdfcraft

jobs:
  resolve:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      version: ${{ steps.upstream.outputs.version }}
      commit: ${{ steps.upstream.outputs.commit }}
    steps:
      - name: Find the latest unpublished upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          if [[ ! "$tag" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Unexpected PdfCraft release tag: $tag"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\" and .draft == false) | .id")
          if [[ -n "$published" ]]; then
            echo "$tag is already published."
            exit 0
          fi
          commit=$(gh api "repos/$UPSTREAM/commits/$tag" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$tag" "$version" "$commit" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --location --retry 4 \
            "https://codeload.github.com/$UPSTREAM/legacy.tar.gz/$commit" \
            --output "pdfcraft-$version-upstream-source.tar.gz"
      - name: Keep the original upstream archive
        if: steps.upstream.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-source
          path: pdfcraft-*-upstream-source.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  windows:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: stable
      PDFCRAFT_BUILD_LABEL: NoverNobida
      PDFCRAFT_VERSION: ${{ needs.resolve.outputs.version }}
      PDFCRAFT_BUILD_SHA: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pdfcraft-source
          path: build-inputs
      - name: Prepare Windows source and translations
        run: |
          python scripts/prepare.py "build-inputs/pdfcraft-$env:PDFCRAFT_VERSION-upstream-source.tar.gz" upstream windows "$env:PDFCRAFT_VERSION"
      - name: Install Rust and WiX
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolDir = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install wix --tool-path $toolDir --version 5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolDir >> $env:GITHUB_PATH
      - name: Build and verify the Windows x64 MSI
        working-directory: upstream
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-windows
          path: upstream/dist/release/pdfcraft-${{ needs.resolve.outputs.version }}-windows-x64.msi
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  web:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
      PDFCRAFT_BUILD_LABEL: NoverNobida
      PDFCRAFT_VERSION: ${{ needs.resolve.outputs.version }}
      PDFCRAFT_BUILD_SHA: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pdfcraft-source
          path: build-inputs
      - name: Prepare Web source and translations
        run: |
          python scripts/prepare.py "build-inputs/pdfcraft-$PDFCRAFT_VERSION-upstream-source.tar.gz" upstream web "$PDFCRAFT_VERSION"
      - name: Install Rust and Trunk
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          archive="$RUNNER_TEMP/trunk.tar.gz"
          curl --fail --silent --show-error --location --retry 4 \
            'https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$HOME/.cargo/bin" trunk
      - name: Build and package the static site
        working-directory: upstream
        run: |
          (cd apps/pdfcraft-web && trunk build --release --locked)
          bash packaging/web/package.sh --skip-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-web
          path: upstream/dist/release/pdfcraft-web-${{ needs.resolve.outputs.version }}.zip
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [resolve, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      UPSTREAM_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pdfcraft-*
          path: artifacts
          merge-multiple: true
      - name: Publish the matching release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          if [[ "$latest" != "$TAG" ]]; then
            echo "Upstream now marks $latest as latest. Skipping $TAG."
            exit 0
          fi
          source="pdfcraft-$VERSION-upstream-source.tar.gz"
          msi="pdfcraft-$VERSION-windows-x64.msi"
          web="pdfcraft-web-$VERSION.zip"
          sha256sum "$source" "$msi" "$web" > SHA256SUMS.txt

          notes="$RUNNER_TEMP/pdfcraft-release.md"
          marker="<!-- pdfcraft-upstream:$UPSTREAM_COMMIT -->"
          cat > "$notes" <<EOF
          $marker
          基于 [上游 PdfCraft $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG) 的独立构建。两个应用均默认使用简体中文。Windows 优先使用系统中文字体，应用内更新检查指向本仓库。

          - **Windows x64 安装包** — \`$msi\`（MSI，未做 Authenticode 签名）
          - **网页端** — \`$web\`（解压后把整个目录放到 HTTP 或 HTTPS 静态站点）
          - **上游源代码** — \`$source\`（原始上游归档，提交 [$UPSTREAM_COMMIT](https://github.com/$UPSTREAM/commit/$UPSTREAM_COMMIT)）
          - **校验清单** — \`SHA256SUMS.txt\`
          EOF
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | {draft, body}")
          if [[ -z "$existing" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "PdfCraft $TAG" --target "$GITHUB_SHA" --notes-file "$notes"
          elif jq -e '.draft == false' <<< "$existing" >/dev/null; then
            echo "$TAG is already published."
            exit 0
          elif ! jq -e --arg marker "$marker" '(.body // "") | contains($marker)' <<< "$existing" >/dev/null; then
            echo "::error::Existing draft $TAG belongs to another release."
            exit 1
          fi
          gh release upload "$TAG" "$source" "$msi" "$web" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --notes-file "$notes" --draft=false --latest
